<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>Pre-Interview Assessment</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a single assessment column (max 780px) under a sticky candidate bar; the report widens into labelled bands. */
:root {
  --bg: #F2F5F3;
  --surface: #FFFFFF;
  --ink: #15201B;
  --muted: #56675F;
  --line: #D6DFDA;
  --accent: #1D6A55;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0EEE8;
  --amber: #A86A12;
  --amber-soft: #FAEFD9;
  --good: #23784A;
  --good-soft: #E1F2E7;
  --bad: #B23F2B;
  --bad-soft: #F8E4DF;
  --dot: #C3D2CA;
  --glow: rgba(29, 106, 85, 0.16);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512; --surface: #16201C; --ink: #E4ECE8; --muted: #98AAA2; --line: #2A3732;
    --accent: #5DBF9F; --accent-ink: #0E1512; --accent-soft: #1A322A;
    --amber: #E3A94C; --amber-soft: #3A2C14; --good: #6CC791; --good-soft: #193526;
    --bad: #E58371; --bad-soft: #3C1F19; --dot: #26352F; --glow: rgba(93, 191, 159, 0.13); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512; --surface: #16201C; --ink: #E4ECE8; --muted: #98AAA2; --line: #2A3732;
  --accent: #5DBF9F; --accent-ink: #0E1512; --accent-soft: #1A322A;
  --amber: #E3A94C; --amber-soft: #3A2C14; --good: #6CC791; --good-soft: #193526;
  --bad: #E58371; --bad-soft: #3C1F19; --dot: #26352F; --glow: rgba(93, 191, 159, 0.13); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.4rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }

/* candidate bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 780px; margin: 0 auto; padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--display); font-size: 1.02rem; }
.steps { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.steps li { display: inline-flex; gap: 5px; font-family: var(--mono); font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; color: var(--muted); border: 1px solid var(--line); white-space: nowrap; transition: background-color 0.2s, color 0.2s; }
.meter { height: 3px; }
.meter i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1); }
.steps li.done { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
.steps li.now { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.timer { font-family: var(--mono); font-weight: 600; font-size: 1rem; padding: 4px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.timer.warn { background: var(--amber-soft); color: var(--amber); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.lede { font-size: 1.05rem; max-width: 64ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.92rem; }
input[type=text], textarea { font: inherit; font-size: 16px; font-weight: 400; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; width: 100%; }
textarea { min-height: 96px; resize: vertical; }
input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
.chip { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color 0.15s, background-color 0.15s; }
.chip:hover { border-color: var(--accent); }
.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.chip input { margin-top: 4px; accent-color: var(--accent); }
.chip span { display: flex; flex-direction: column; font-size: 0.9rem; }
.chip small { color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 7px; padding: 10px 18px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; color: var(--accent); }
button.quiet { background: transparent; border-color: var(--line); color: var(--muted); font-weight: 500; }
button.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
button:disabled { opacity: 0.55; cursor: progress; }
button, a.btnlink { transition: background-color 0.15s, color 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s; }
button:not(.ghost):not(.quiet):not(:disabled):hover, a.btnlink:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -10px var(--accent); }
button.ghost:hover { background: var(--accent-soft); }
button.quiet:hover { border-color: var(--muted); color: var(--ink); }
button:active, a.btnlink:active { transform: translateY(0); box-shadow: none; }
a.btnlink { display: inline-block; font-weight: 600; text-decoration: none; border-radius: 7px; padding: 10px 18px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
a.btnlink:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.msg { font-size: 0.9rem; color: var(--bad); }
.msg.ok { color: var(--good); }
.note { font-size: 0.86rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }

/* likert */
.item { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item p { font-weight: 500; }
.item .num { font-family: var(--mono); color: var(--muted); font-size: 0.8rem; margin-right: 8px; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.opt { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 46px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 6px; font-size: 0.82rem; line-height: 1.2; cursor: pointer; color: var(--muted); transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s; }
.opt:hover { border-color: var(--accent); color: var(--ink); }
.opt:active { transform: scale(0.97); }
.opt .n { display: none; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.opt:has(input:focus-visible) { outline: 3px solid var(--amber); outline-offset: 1px; }
.scale-key { display: none; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }

/* sjt */
.scenario h3 { display: flex; gap: 10px; align-items: baseline; }
.scenario h3 .mono { font-size: 0.8rem; color: var(--accent); }
.sjt { width: 100%; border-collapse: collapse; }
.sjt th { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; text-align: center; padding: 6px 4px; }
.sjt th:first-child { text-align: left; }
.sjt td { border-top: 1px solid var(--line); padding: 10px 4px; vertical-align: top; }
.sjt th.most { color: var(--good); }
.sjt th.least { color: var(--bad); }
.sjt td.pick { width: 64px; padding: 0; vertical-align: middle; }
.sjt tr { transition: background-color 0.15s; }
.sjt tr:has(input.most:checked) { background: var(--good-soft); }
.sjt tr:has(input.least:checked) { background: var(--bad-soft); }
.sjt td:first-child { padding-left: 8px; }
.pickl { display: flex; align-items: center; justify-content: center; min-height: 52px; height: 100%; cursor: pointer; }
.sjt input { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; margin: 0; border: 2px solid var(--line); border-radius: 50%; background: var(--surface); display: grid; place-content: center; cursor: pointer; transition: border-color 0.15s, background-color 0.15s, transform 0.1s; }
.sjt input::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); transform: scale(0); transition: transform 0.15s; }
.pickl:hover input { border-color: var(--accent); }
.sjt input:active { transform: scale(0.9); }
.sjt input.most:checked { background: var(--good); border-color: var(--good); }
.sjt input.least:checked { background: var(--bad); border-color: var(--bad); }
.sjt input:checked::after { transform: scale(1); }
.sjt input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* aptitude */
.tablebox { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
table.data caption { text-align: left; font-weight: 600; padding-bottom: 8px; }
table.data th, table.data td { border: 1px solid var(--line); padding: 7px 10px; text-align: right; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data thead th { background: var(--accent-soft); font-weight: 600; }
.mcq { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
.mcq .opt { font-size: 0.88rem; color: var(--ink); }
.tfc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; max-width: 420px; }
.tfc .opt { font-size: 0.88rem; color: var(--ink); }
.passage { background: var(--bg); border-radius: 8px; padding: 14px 16px; max-width: 70ch; }

/* report */
.report-head { background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.report-head .eyebrow { color: var(--accent-ink); opacity: 0.8; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; }
.meta div { display: flex; flex-direction: column; min-width: 0; }
.meta span { font-size: 0.75rem; opacity: 0.8; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
.meta b { overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--mono); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 0.9rem; color: var(--muted); }
.trait { display: flex; flex-direction: column; gap: 10px; padding: 16px 0; border-top: 1px solid var(--line); }
.trait:first-of-type { border-top: 0; padding-top: 0; }
.trait-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.track { position: relative; height: 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--accent); }
.ref { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
.ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
.pill { font-family: var(--mono); font-size: 0.74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.high, .pill.strong { background: var(--good-soft); color: var(--good); }
.pill.mid, .pill.some { background: var(--amber-soft); color: var(--amber); }
.pill.low, .pill.build { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--accent-soft); color: var(--accent); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kv div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kv span { font-size: 0.74rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.kv p { font-size: 0.93rem; }
.fit { width: 100%; border-collapse: collapse; }
.fit th { text-align: left; font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 6px 8px; font-weight: 600; }
.fit td { border-top: 1px solid var(--line); padding: 12px 8px; vertical-align: top; font-size: 0.92rem; }
.plan { display: flex; flex-direction: column; gap: 0; }
.plan div { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.plan div:first-child { border-top: 0; }
.plan .mono { color: var(--accent); font-size: 0.82rem; padding-top: 2px; }
ol.qs { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.review { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.review > div { font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
.ok-t { color: var(--good); font-weight: 600; }
.no-t { color: var(--bad); font-weight: 600; }
.dl { border: 2px solid var(--accent); }
.credit { border-top: 1px solid var(--line); background: var(--surface); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px; }
.credit p { max-width: 780px; margin: 0 auto; font-size: 0.85rem; color: var(--muted); }
.credit b { color: var(--ink); font-weight: 600; }
/* welcome hero: answer-sheet schedule beside the headline, on a faint dot grid */
.hero { position: relative; overflow: hidden; background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: clamp(36px, 7vw, 88px) clamp(32px, 6vw, 72px); }
.hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--dot) 1.1px, transparent 1.4px); background-size: 22px 22px; -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 95%); mask-image: linear-gradient(to bottom, #000 30%, transparent 95%); pointer-events: none; }
.hero::after { content: ""; position: absolute; width: 720px; height: 720px; right: -220px; top: -320px; background: radial-gradient(closest-side, var(--glow), transparent); pointer-events: none; }
.wrap.wide { max-width: 1140px; }
.wrap.wide > form { max-width: 780px; width: 100%; }
body[data-wide="true"] .bar-in, body[data-wide="true"] .credit p { max-width: 1140px; }
.hero-in { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
.hero-copy { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.hero h1 { font-size: clamp(2.2rem, 5.2vw, 3.7rem); letter-spacing: -0.025em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lede { font-size: clamp(1.02rem, 1.4vw, 1.15rem); color: var(--muted); max-width: 52ch; }
.schedule { list-style: none; margin: 0; padding: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; min-width: 0; box-shadow: 0 24px 48px -32px var(--glow); }
.schedule li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; border-top: 1px dashed var(--line); }
.schedule li:first-child { border-top: 0; }
.schedule .k { font-family: var(--mono); width: 30px; height: 30px; border-radius: 50%; display: grid; place-content: center; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 0.82rem; }
.schedule .end .k { background: var(--accent); color: var(--accent-ink); }
.schedule b { display: block; font-size: 0.97rem; }
.schedule small { display: block; color: var(--muted); font-size: 0.84rem; line-height: 1.35; }
.schedule .t { font-family: var(--mono); font-size: 0.84rem; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.schedule .t em { display: block; font-style: normal; font-size: 0.68rem; color: var(--amber); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.sched-total { display: flex; justify-content: space-between; padding: 10px 18px 0; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
#intro-form, .rsec, .report-head, #sec-download { scroll-margin-top: 110px; }

/* report: sticky contents rail on wide screens, ruled sections instead of stacked cards */
.wrap.report { max-width: 1140px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.report-body { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.toc { display: none; }
.rsec { display: flex; flex-direction: column; gap: 14px; padding-top: 30px; border-top: 1px solid var(--line); min-width: 0; }
@media (min-width: 1100px) {
  .wrap.report { grid-template-columns: 210px minmax(0, 820px); column-gap: 56px; justify-content: start; align-items: start; }
  .toc { display: flex; flex-direction: column; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); gap: 2px; padding-top: 6px; }
  .toc span { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0 12px 8px; }
  .toc a { color: var(--muted); text-decoration: none; font-size: 0.9rem; padding: 6px 12px; border-left: 2px solid var(--line); transition: color 0.15s, border-color 0.15s; }
  .toc a:hover { color: var(--ink); }
  .toc a.on { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  .toc a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
}

@media (max-width: 860px) {
  .hero-in { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 620px) {
  .fit thead { display: none; }
  .fit tr { display: grid; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
  .fit td { border: 0; padding: 0; }
}
@media (max-width: 600px) {
  .bar-in { gap: 6px 10px; padding-block: 8px; }
  .brand .who { display: none; }
  .brand b { font-size: 0.95rem; }
  .timer { order: 2; margin-left: auto; }
  .steps { order: 3; width: 100%; }
  .steps li .l { display: none; }
  .steps li.now .l { display: inline; }
}
@media (max-width: 560px) {
  .opt .t { display: none; }
  .opt .n { display: block; font-family: var(--mono); font-size: 1.05rem; font-weight: 600; }
  .scale-key { display: flex; }
  .card { padding: 16px; }
  .sjt td.pick { width: 52px; }
  .plan div { grid-template-columns: 1fr; gap: 2px; }
  .schedule li { padding: 12px 14px; gap: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
  .wrap { animation: rise 0.3s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .hero-copy > *, .schedule li { animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .hero-copy > :nth-child(2) { animation-delay: 0.06s; }

// Where downloads are blocked (signed-out visitors to the claude.ai link), the full version takes over, answers carried in the URL hash.
const FULL_URL = "https://will2040.github.io/pre-interview-assessment/";
function pack(s) { return btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unpack(h) { return JSON.parse(decodeURIComponent(escape(atob(h.replace(/-/g, "+").replace(/_/g, "/"))))); }
const handoffUrl = () => SAMPLE ? FULL_URL + "#sample" : FULL_URL + "#r=" + pack(state);
function useHandoff() {
  dlReady.then(dl => {
    if (dl !== null || window.top === window.self || state.step !== "results") return;
    document.querySelectorAll('button[data-act="pdf"]').forEach(btn => {
      const a = document.createElement("a");
      a.className = "btnlink"; a.href = handoffUrl(); a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Open PDF download page"; a.dataset.handoff = "1";
      btn.replaceWith(a);
    });
    const copy = document.querySelector('button[data-act="copy"]');
    if (copy && !document.querySelector('button[data-act="copy-link"]')) {
      const c = document.createElement("button");
      c.type = "button"; c.className = "ghost"; c.dataset.act = "copy-link"; c.textContent = "Copy download page link";
      copy.before(c);
    }
    const msg = document.getElementById("pdf-msg");
    if (msg) { msg.className = "msg ok"; msg.textContent = "This link can't save files directly, so your report opens in a new tab with your answers carried over. Press Download PDF report there. If no tab opens, copy the download page link and paste it into your browser's address bar."; }
  });
}

/* ---------- rendering ---------- */
function renderBar(timerPart) {
  const cur = { intro: -1, A: 0, B: 1, c: 2, d: 3, results: 4 }[state.step];
  const who = state.profile.name ? `<span class="small muted who">${esc(state.profile.name)} <span class="mono">${esc(state.id)}</span></span>` : `<span class="small muted who">Graduate selection simulation</span>`;
  const steps = STEPS.map(([k, l], i) => `<li class="${i < cur ? "done" : i === cur ? "now" : ""}"${i === cur ? ' aria-current="step"' : ""}><span class="k">${k}</span><span class="l">${l}</span></li>`).join("");
  const timer = timerPart ? `<span class="timer" id="timer" aria-live="off">${fmt(remaining(timerPart))}</span>` : "";
  bar.innerHTML = `<div class="brand"><b>Pre-Interview Assessment</b>${who}</div><ol class="steps" aria-label="Sections">${steps}</ol>${timer}`;
}

const hero = document.getElementById("hero");
function render() {
  clearInterval(ticker);
  if (spyIO) { spyIO.disconnect(); spyIO = null; }
  const s = state.step;
  hero.hidden = s !== "intro";
  if (s !== "intro") hero.innerHTML = "";
  app.className = s === "results" ? "wrap report" : s === "intro" ? "wrap wide" : "wrap";
  document.body.dataset.wide = String(s === "intro" || s === "results");
  if (s === "intro") renderIntro();
  else if (s === "A") renderA();
  else if (s === "B") renderB();
  else if (s === "c" || s === "d") renderTimed(s);
  else renderResults();
  progress();
}

function sjtDone() { return SJT.filter((s, i) => state.b[i] && state.b[i].most !== undefined && state.b[i].least !== undefined).length; }
function progress() {
  const s = state.step, cnt = k => Object.keys(state[k].answers || {}).length;
  const p = s === "A" ? Object.keys(state.a).length / 50 * 0.35
    : s === "B" ? 0.35 + sjtDone() / 8 * 0.25
    : s === "c" ? 0.6 + cnt("c") / 8 * 0.2
    : s === "d" ? 0.8 + cnt("d") / 8 * 0.2
    : s === "results" ? 1 : 0;
  const m = document.getElementById("meter");
  if (m) m.style.transform = `scaleX(${p})`;
}

let spyIO = null;
function spy() {
  const links = [...document.querySelectorAll(".toc a")];
  if (!links.length || !("IntersectionObserver" in window)) return;
  spyIO = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + en.target.id)); });
  }, { rootMargin: "-25% 0px -65% 0px" });
  links.forEach(l => { const t = document.getElementById(l.getAttribute("href").slice(1)); if (t) spyIO.observe(t); });
}

function remaining(part) {
  const p = state[part];
  if (!p.deadline) return TIMED[part].secs;
  return Math.max(0, Math.round((p.deadline - Date.now()) / 1000));
}

function renderTimed(part) {

  const letter = part.toUpperCase();
  if (!p.deadline) {
    renderBar();
    app.innerHTML = `
    <div class="eyebrow">Section ${letter} | ${T.items.length} questions | ${T.secs / 60} minutes</div>

      ? `<p class="lede">You will see two data tables and eight questions. Choose the correct answer for each. You may use a calculator and scrap paper.</p>`

    <p class="note">The timer starts when you press Start and keeps running if you leave the page. When time runs out, your answers are submitted automatically. Unanswered questions score zero, so keep moving.</p>

  } else {
    body = PASSAGES.map((ps, pi) => `<div class="card"><h3>Passage ${pi + 1}: ${esc(ps.title)}</h3><p class="passage">${esc(ps.text)}</p>

        <div class="tfc">${TFC.map((o, j) => `<label class="opt"><input type="radio" name="d-${i}" value="${j}" ${p.answers[i] === j ? "checked" : ""}>${o}</label>`).join("")}</div></div>`).join("")}</div>`).join("");
  }
  app.innerHTML = `<div class="eyebrow">Section ${letter} | Timed</div><h1>${T.label}</h1>${body}

  ticker = setInterval(() => {
    const left = remaining(part);
    const el = document.getElementById("timer");
    if (el) { el.textContent = fmt(left); el.classList.toggle("warn", left <= 60); }

}

function finishTimed(part, timedOut) {
  clearInterval(ticker);
  const p = state[part];
  if (p.done) return;
  p.done = true;
  p.timedOut = !!timedOut;
  p.used = Math.min(TIMED[part].secs, Math.round((Date.now() - p.startedAt) / 1000));
  state.step = part === "c" ? "d" : "results";
  save(); render(); window.scrollTo(0, 0);
}

/* ---------- scoring ---------- */
function band(t, m) { const d = m - TRAITS[t].ref; return d < -0.5 ? "low" : d > 0.5 ? "high" : "mid"; }
const BAND_PTS = { low: 0, mid: 1, high: 2 };

function compute() {
  const traits = {};
  TRAIT_ORDER.forEach(t => {
    let sum = 0, n = 0;
    ITEMS.forEach((it, i) => { if (it[1] === t && state.a[i]) { sum += it[2] > 0 ? state.a[i] : 6 - state.a[i]; n++; } });
    const m = n ? sum / n : 3;
    traits[t] = { mean: m, diff: m - TRAITS[t].ref, band: band(t, m) };
  });
  const sjt = SJT.map((s, i) => { const a = state.b[i] || {}; const pts = (a.most === s.most ? 1 : 0) + (a.least === s.least ? 1 : 0); return { pts, most: a.most, least: a.least }; });
  const sjtTotal = sjt.reduce((x, s) => x + s.pts, 0);
  const apt = {};
  ["c", "d"].forEach(k => {
    const items = TIMED[k].items, ans = state[k].answers || {};
    const attempted = Object.keys(ans).length;
    const correct = items.reduce((x, q, i) => x + (ans[i] === q.ans ? 1 : 0), 0);
    apt[k] = { attempted, correct, n: items.length, used: state[k].used || 0, timedOut: !!state[k].timedOut };
  });
  const aptPct = (apt.c.correct + apt.d.correct) / (apt.c.n + apt.d.n);
  const comps = COMPS.map(c => {
    const traitPts = c.traits.reduce((x, t) => x + BAND_PTS[traits[t].band], 0) / c.traits.length;
    let main, source;
    if (c.sjt === null) { main = aptPct >= 0.75 ? 2 : aptPct >= 0.5 ? 1 : 0; source = `Reasoning tests ${apt.c.correct + apt.d.correct}/16`; }
    else { main = sjt[c.sjt].pts; source = `Scenario ${c.sjt + 1}: ${main}/2`; }
    const score = 0.6 * main + 0.4 * traitPts;
    const status = score >= 1.4 ? "strong" : score >= 0.8 ? "some" : "build";
    return Object.assign({}, c, { score, status, source, traitNote: c.traits.map(t => `${TRAITS[t].name} ${BAND_LABEL[traits[t].band].toLowerCase()}`).join(", ") });
  });
  const ranked = TRAIT_ORDER.slice().sort((x, y) => traits[y].diff - traits[x].diff);
  const top = ranked.slice(0, 2), grow = ranked[ranked.length - 1];
  const selected = comps.filter(c => state.profile.comps.includes(c.id));
  const weakest = selected.slice().sort((x, y) => x.score - y.score)[0] || comps.slice().sort((x, y) => x.score - y.score)[0];
  const strongest = selected.slice().sort((x, y) => y.score - x.score)[0] || comps.slice().sort((x, y) => y.score - x.score)[0];
  return { traits, sjt, sjtTotal, apt, aptPct, comps, selected, top, grow, weakest, strongest };
}

const STATUS_LABEL = { strong: "Strong evidence", some: "Some evidence", build: "Build evidence" };
function aptInsight(r) {
  const acc = r.attempted ? r.correct / r.attempted : 0;
  if (r.attempted < r.n && r.timedOut) return `You answered ${r.attempted} of ${r.n} before time ran out. Speed is your first lever: practise under a timer, skip any question that stalls you, and come back if time allows.`;
  if (r.attempted < r.n) return `You submitted with ${r.n - r.attempted} unanswered and ${r.correct} of ${r.n} correct. A blank always scores zero, so unless the instructions say wrong answers lose marks, an educated guess is better than leaving a question out.`;
  if (r.correct === r.n) return "Full marks within the time. Keep the skill sharp with occasional timed practice, and try other formats such as inductive (pattern) reasoning.";
  if (acc < 0.6) return `You finished in time, but ${r.correct} of ${r.n} were correct. Slow down slightly: reread the question, check which figure a percentage is based on, and check units before choosing.`;
  return `A solid balance of speed and accuracy (${r.correct}/${r.n}). Review the questions you missed to spot any pattern.`;
}

function plan(R) {
  const g = TRAITS[R.grow][R.traits[R.grow].band];
  const aptLines = [];
  if (R.apt.c.correct < 7) aptLines.push("numerical");
  if (R.apt.d.correct < 7) aptLines.push("verbal");
  const w3 = aptLines.length
    ? `Complete two timed ${aptLines.join(" and ")} reasoning practice tests from your careers service or a graduate careers website. Note the question types that cost you the most time.`
    : "Your reasoning scores are strong (7 or more out of 8 on both tests). Try an assessment format you haven't met yet, such as inductive (pattern) reasoning or a game-based assessment, so nothing surprises you in a real application.";
  return [
    ["Week 1", `${TRAITS[R.grow].name}: ${g.dev}`],
    ["Week 2", `Write and rehearse a STAR story about ${R.weakest.star} (${R.weakest.name}). Ask a classmate to challenge it with follow-up questions.`],
    ["Week 3", w3],
    ["Week 4", `Update your CV bullet points and LinkedIn About section so they show evidence for ${R.strongest.name.toLowerCase()}, the strength you want this employer to remember.`]
  ];
}

function questions(R) {
  const q = [`Walk me through your CV. Why are you interested in the ${state.profile.role || "role"} position${state.profile.company ? " at " + state.profile.company : ""}?`];
  R.top.forEach(t => q.push(TRAITS[t][R.traits[t].band].probe));
  q.push(TRAITS[R.grow][R.traits[R.grow].band].probe);
  R.selected.filter(c => c.status !== "strong").slice(0, 3).forEach(c => q.push(`Tell me about ${c.star}.`));
  if (q.length < 6) R.selected.filter(c => c.status === "strong").slice(0, 6 - q.length).forEach(c => q.push(`Tell me about ${c.star}.`));
  return [...new Set(q)];
}

      <div class="track" role="img" aria-label="${T.name}: ${r.mean.toFixed(1)} out of 5; reference average ${T.ref.toFixed(1)}"><div class="fill" style="width:${pct}%"></div><div class="ref" style="left:calc(${refPct}% - 1px)"></div></div>
      <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>

    </div>`;
  }).join("");

  const fitRows = (R.selected.length ? R.selected : R.comps).map(c => `<tr>
      <td><b>${c.name}</b><br><span class="small muted">${esc(c.source)}; ${esc(c.traitNote)}</span></td>
      <td><span class="pill ${c.status}">${STATUS_LABEL[c.status]}</span></td>
      <td>Prepare a STAR story about ${esc(c.star)}.</td></tr>`).join("");

  const sjtReview = SJT.map((s, i) => { const r = R.sjt[i];
    return `<div><b>${i + 1}. ${esc(s.title)}</b> <span class="${r.pts === 2 ? "ok-t" : r.pts === 1 ? "" : "no-t"}">${r.pts}/2</span>
      <span>Best response: ${esc(s.opts[s.most])}</span>
      <span>Least effective: ${esc(s.opts[s.least])}</span>
      <span class="muted">${esc(s.why)}</span></div>`; }).join("");
  const numReview = NUM.map((q, i) => { const a = state.c.answers[i]; const ok = a === q.ans;
    return `<div><b>Q${i + 1}.</b> ${esc(q.q)} <span class="${ok ? "ok-t" : "no-t"}">${ok ? "Correct" : a === undefined ? "Not answered" : "Incorrect"}</span><span>Answer: ${esc(q.opts[q.ans])}. ${esc(q.work)}</span></div>`; }).join("");
  const verbReview = VERB.map((q, i) => { const a = state.d.answers[i]; const ok = a === q.ans;
    return `<div><b>Q${i + 1}.</b> ${esc(q.s)} <span class="${ok ? "ok-t" : "no-t"}">${ok ? "Correct" : a === undefined ? "Not answered" : "Incorrect"}</span><span>Answer: ${TFC[q.ans]}. ${esc(q.why)}</span></div>`; }).join("");

  const aptBlock = k => { const r = R.apt[k];

  <section class="rsec" id="sec-work">

/* ---------- PDF ---------- */
const clean = s => String(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").replace(/…/g, "...").replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ]/g, "");

function buildPdf() {
  const R = compute(), P = state.profile;
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
  const M = 18, W = 210, H = 297, CW = W - 2 * M, PT = 0.3528;
  const INK = [21, 32, 27], MUTED = [86, 103, 95], ACC = [29, 106, 85], LINE = [214, 223, 218], SOFT = [242, 245, 243];
  const STAT_C = { strong: [35, 120, 74], some: [168, 106, 18], build: [178, 63, 43], high: [35, 120, 74], mid: [168, 106, 18], low: [178, 63, 43] };
  let y = M;
  const ensure = h => { if (y + h > H - 20) { doc.addPage(); y = M; } };
  function text(t, o = {}) {
    const size = o.size || 10, x = o.x || M, w = o.w || CW, lh = o.lh || 1.4;
    doc.setFont("helvetica", o.style || "normal"); doc.setFontSize(size); doc.setTextColor(...(o.color || INK));
    const lines = doc.splitTextToSize(clean(t), w), step = size * PT * lh;
    lines.forEach(l => { ensure(step); doc.text(l, x, y + size * PT * 0.9); y += step; });
    y += o.after || 0;
  }
  function heading(t, eyebrow) {
    ensure(22); y += 5;
    if (eyebrow) text(eyebrow.toUpperCase(), { size: 7.5, style: "bold", color: MUTED, lh: 1.2 });
    text(t, { size: 14, style: "bold", color: ACC, lh: 1.25 });
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, y + 0.5, W - M, y + 0.5); y += 4;
  }
  const label = t => text(t.toUpperCase(), { size: 7.5, style: "bold", color: MUTED, lh: 1.3 });
  function bullet(t, o = {}) {
    const size = o.size || 10; ensure(size * PT * 1.4);
    doc.setFont("helvetica", "normal"); doc.setFontSize(size); doc.setTextColor(...INK);
    doc.text(o.mark || "-", M + 1, y + size * PT * 0.9);
    text(t, { x: M + 7, w: CW - 7, size, after: o.after == null ? 1.2 : o.after });
  }
  function pill(t, color, x, yy) {
    doc.setFont("helvetica", "bold"); doc.setFontSize(8);
    const w = doc.getTextWidth(t) + 5;
    doc.setFillColor(...color); doc.roundedRect(x - w, yy - 3.6, w, 5, 2.5, 2.5, "F");
    doc.setTextColor(255, 255, 255); doc.text(t, x - w + 2.5, yy);
  }

  // cover band
  doc.setFillColor(...ACC); doc.rect(0, 0, W, 44, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.text("PRE-INTERVIEW ASSESSMENT | CANDIDATE REPORT", M, 14);
  doc.setFontSize(22); doc.text(clean(P.name || "Candidate"), M, 26);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  doc.text(clean(`${P.role || "Role not stated"}${P.company ? " | " + P.company : ""}`), M, 34);
  doc.text(clean(`${P.programme ? P.programme + " | " : ""}${state.date} | ${state.id}`), M, 39.5);
  doc.setFontSize(7.5); doc.text(clean(CREDIT), W - M, 14, { align: "right" });
  y = 54;

  // summary
  label("At a glance");
  const boxes = [["Lead with", `${TRAITS[R.top[0]].name}`, `and ${TRAITS[R.top[1]].name.toLowerCase()}`], ["Judgement", `${R.sjtTotal}/16`, "scenario points"], ["Numerical", `${R.apt.c.correct}/8`, `${fmt(R.apt.c.used)} used`], ["Verbal", `${R.apt.d.correct}/8`, `${fmt(R.apt.d.used)} used`]];
  const bw = (CW - 9) / 4;
  boxes.forEach((b, i) => {
    const x = M + i * (bw + 3);
    doc.setFillColor(...SOFT); doc.setDrawColor(...LINE); doc.roundedRect(x, y, bw, 22, 2, 2, "FD");
    doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(...MUTED); doc.text(b[0].toUpperCase(), x + 3, y + 5.5);
    doc.setFontSize(i === 0 ? 9.5 : 15); doc.setTextColor(...INK); doc.text(doc.splitTextToSize(clean(b[1]), bw - 6)[0], x + 3, y + 13);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...MUTED); doc.text(doc.splitTextToSize(clean(b[2]), bw - 6)[0], x + 3, y + 18.5);
  });
  y += 28;
  text(`Area to develop: ${TRAITS[R.grow].name}. ${TRAITS[R.grow][R.traits[R.grow].band].watch}`, { size: 9.5, color: INK, after: 1 });

  // work style
  heading("Work-style profile", "1 | Work style");
  text("Bars show your average score (1 to 5). The dark tick marks the average of 10,189 people who took the same questionnaire online. Higher or Lower means more than half a point from that average. No profile is better than another.", { size: 8.5, color: MUTED, after: 3 });
  TRAIT_ORDER.forEach(t => {
    const T = TRAITS[t], r = R.traits[t], c = T[r.band];
    ensure(52);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...INK);
    doc.text(clean(T.name), M, y + 4);
    const nameW = doc.getTextWidth(clean(T.name));
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
    doc.text(clean(T.tech), M + nameW + 3, y + 4);
    pill(`${BAND_LABEL[r.band]} | ${r.mean.toFixed(1)}/5`, STAT_C[r.band], W - M, y + 4);
    y += 7;
    const bx = M, bwid = CW;
    doc.setFillColor(...SOFT); doc.setDrawColor(...LINE); doc.roundedRect(bx, y, bwid, 3.6, 1.8, 1.8, "FD");
    doc.setFillColor(...ACC); doc.roundedRect(bx, y, Math.max(3.6, bwid * (r.mean - 1) / 4), 3.6, 1.8, 1.8, "F");
    const rx = bx + bwid * (T.ref - 1) / 4; doc.setDrawColor(...INK); doc.setLineWidth(0.7); doc.line(rx, y - 1.4, rx, y + 5); doc.setLineWidth(0.3);
    y += 8;
    text(c.look, { size: 9.5, after: 1 });
    label("Strengths to lead with"); text(c.str, { size: 9.5, after: 1 });
    label("Watch-outs"); text(c.watch, { size: 9.5, after: 1 });
    label("Try this"); text(c.dev, { size: 9.5, after: 4 });
  });

  // job fit
  heading(`Evidence for ${P.role || "your target role"}`, "2 | Job fit");
  text("Competencies you identified in the job advert, checked against today's results. 'Build evidence' means today's assessment did not show it, so your interview examples need to.", { size: 8.5, color: MUTED, after: 3 });
  (R.selected.length ? R.selected : R.comps).forEach(c => {
    ensure(20);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...INK); doc.text(clean(c.name), M, y + 4);
    pill(STATUS_LABEL[c.status], STAT_C[c.status], W - M, y + 4);
    y += 6.5;
    text(`${c.source}; ${c.traitNote}`, { size: 8.5, color: MUTED });
    text(`Prepare a STAR story about ${c.star}.`, { size: 9.5, after: 3 });
  });

  // sjt + aptitude
  heading("Situational judgement and reasoning", "3 | Judgement and aptitude");
  text(`Situational judgement: ${R.sjtTotal}/16.`, { size: 10.5, style: "bold" });
  SJT.forEach((s, i) => bullet(`${s.title} (${COMPS.find(c => c.id === s.comp).name}): ${R.sjt[i].pts}/2`, { size: 9.5, after: 0.4 }));
  y += 3;
  ["c", "d"].forEach(k => { const r = R.apt[k];
    text(`${TIMED[k].label}: ${r.correct}/${r.n} correct, ${r.attempted} answered, ${fmt(r.used)} of ${fmt(TIMED[k].secs)} used${r.timedOut ? ", time ran out" : ""}.`, { size: 10.5, style: "bold" });
    text(aptInsight(r), { size: 9.5, after: 3 }); });

  // plan + questions
  heading("Your 30-day development plan", "4 | Next steps");
  plan(R).forEach(([w, t]) => { ensure(14); text(w.toUpperCase(), { size: 8, style: "bold", color: ACC, lh: 1.3 }); text(t, { size: 9.5, after: 2.5 }); });
  heading("Questions to prepare for", "5 | Interview preparation");
  questions(R).forEach((q, i) => bullet(q, { mark: `${i + 1}.`, size: 9.5, after: 1.5 }));

  // reflection
  heading("My reflection", "6 | Reflection");
  [["Which two results best support my application, and why?", "r1"], ["Which result might concern this employer, and what evidence addresses it?", "r2"], ["My STAR story for my strongest competency", "r3"]].forEach(([q, k]) => {
    label(q); text(state.reflect[k].trim() || "(Not completed)", { size: 9.5, color: state.reflect[k].trim() ? INK : MUTED, after: 3 });
  });

  // interviewer page
  doc.addPage(); y = M;
  heading("Interviewer notes", "For the mock interview panel");
  text(`Candidate: ${P.name} | ${P.role || "Role not stated"}${P.company ? " at " + P.company : ""} | ${state.id}`, { size: 9.5, after: 3 });
  label("Suggested probes from this report");
  questions(R).slice(1, 5).forEach((q, i) => bullet(q, { mark: `${i + 1}.`, size: 9.5, after: 1 }));
  y += 4;
  const rubric = ["Opening and motivation for the role", "Evidence for job competencies (STAR)", "Self-awareness: discusses own results honestly", "Communication and professional presence", "Questions asked of the interviewer"];
  label("Ratings (1 = needs work, 5 = excellent)");
  rubric.forEach(r => {
    ensure(9);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(clean(r), M, y + 4);
    for (let n = 0; n < 5; n++) { const x = W - M - 5 * 9 + n * 9; doc.setDrawColor(...LINE); doc.rect(x, y, 6, 6); doc.setFontSize(7); doc.setTextColor(...MUTED); doc.text(String(n + 1), x + 2.1, y + 4.3); }
    y += 9;
  });
  y += 4; label("Notes and feedback");
  doc.setDrawColor(...LINE);
  while (y < H - 28) { y += 8; doc.line(M, y, W - M, y); }

  // footer
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(...INK);
    doc.text(clean(CREDIT), M, H - 14);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...MUTED);
    doc.text(clean(`Training simulation, not a validated selection instrument. Work-style items: IPIP Big-Five Factor Markers (Goldberg, 1992), public domain.`), M, H - 10);
    doc.text(`Page ${i} of ${pages}`, W - M, H - 10, { align: "right" });
  }
  return doc;
}

function reportText() {
  const R = compute(), P = state.profile;
  const L = [`PRE-INTERVIEW ASSESSMENT REPORT`, `${P.name} | ${P.role}${P.company ? " at " + P.company : ""} | ${state.date} | ${state.id}`, "",
    `Judgement ${R.sjtTotal}/16 | Numerical ${R.apt.c.correct}/8 | Verbal ${R.apt.d.correct}/8`, "", "WORK STYLE"];
  TRAIT_ORDER.forEach(t => { const r = R.traits[t], c = TRAITS[t][r.band]; L.push(`${TRAITS[t].name}: ${BAND_LABEL[r.band]} (${r.mean.toFixed(1)}/5). ${c.look} Strengths: ${c.str} Watch-outs: ${c.watch} Try this: ${c.dev}`); });
  L.push("", "JOB FIT"); (R.selected.length ? R.selected : R.comps).forEach(c => L.push(`${c.name}: ${STATUS_LABEL[c.status]}. Prepare a STAR story about ${c.star}.`));
  L.push("", "30-DAY PLAN"); plan(R).forEach(([w, t]) => L.push(`${w}: ${t}`));
  L.push("", "QUESTIONS TO PREPARE FOR"); questions(R).forEach((q, i) => L.push(`${i + 1}. ${q}`));
  L.push("", "REFLECTION", state.reflect.r1, "", state.reflect.r2, "", state.reflect.r3, "", CREDIT);
  return L.join("\n");
}

async function downloadPdf(btn) {
  const msg = document.getElementById("pdf-msg");
  const say = (t, ok) => { if (msg) { msg.textContent = t; msg.className = ok ? "msg ok" : "msg"; } };
  if (!window.jspdf) { say("The PDF tool didn't load. Check your internet connection and reload the page. Your answers are saved."); return; }
  const filename = `Assessment report - ${(state.profile.name || "candidate").replace(/[^\w .-]/g, "").trim()}.pdf`;
  btn.disabled = true; say("Preparing your PDF...", true);
  try {
    const doc = buildPdf();
    const dl = await dlReady;
    if (dl) {
      try { await dl.save({ filename, data: doc.output("blob") }); say("PDF saved.", true); }
      catch (e) { say(e && e.code === "declined" ? "Download cancelled." : "This view couldn't save the file. Use 'Copy report as text' instead, or ask your lecturer for the offline version."); }
    } else if (dl === null && window.top !== window.self) {
      say("This view doesn't allow downloads. Use 'Copy report as text', or ask your lecturer for the offline version of this assessment.");
    } else { doc.save(filename); say("Your PDF is downloading.", true); }
  } catch (e) { say("Something went wrong creating the PDF. Reload the page and try again; your answers are saved."); }
  btn.disabled = false;
}

/* ---------- events ---------- */
app.addEventListener("change", e => {
  const t = e.target, n = t.name || "";
  let m;
  if ((m = n.match(/^a-(\d+)$/))) { state.a[+m[1]] = +t.value; const c = document.getElementById("a-count"); if (c) c.textContent = Object.keys(state.a).length; }
  else if ((m = n.match(/^b-(\d+)-(most|least)$/))) {
    const i = +m[1], kind = m[2], other = kind === "most" ? "least" : "most";
    state.b[i] = state.b[i] || {}; state.b[i][kind] = +t.value;
    if (state.b[i][other] === +t.value) { delete state.b[i][other]; const o = app.querySelector(`input[name="b-${i}-${other}"][value="${t.value}"]`); if (o) o.checked = false; }
  }
  else if ((m = n.match(/^([cd])-(\d+)$/))) { if (!state[m[1]].done) state[m[1]].answers[+m[2]] = +t.value; }
  else return;
  save();
  progress();
  const bc = document.getElementById("b-count"); if (bc) bc.textContent = sjtDone();
  const tc = document.getElementById("t-count");
  if (tc && TIMED[state.step]) tc.textContent = `${Object.keys(state[state.step].answers).length} of ${TIMED[state.step].items.length}`;
});

// in-page jumps (hero CTA, report contents) scroll without touching the URL hash
document.addEventListener("click", e => {
  const j = e.target.closest("a[data-jump], .toc a");
  if (!j) return;
  const t = document.getElementById(j.dataset.jump || j.getAttribute("href").slice(1));
  if (!t) return;
  e.preventDefault();
  t.scrollIntoView({ block: "start" });
  if (j.dataset.jump) { const f = t.querySelector("input"); if (f) setTimeout(() => f.focus({ preventScroll: true }), 450); }
});
app.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.r; if (k) { state.reflect[k] = e.target.value; save(); } });

app.addEventListener("submit", e => {
  if (e.target.id !== "intro-form") return;
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const comps = [...app.querySelectorAll('input[name="comp"]:checked')].map(i => i.value);
  const msg = document.getElementById("intro-msg");
  if (!v("f-name") || !v("f-role")) { msg.textContent = "Add your name and the job title you applied for."; return; }
  if (comps.length < 3 || comps.length > 5) { msg.textContent = `Choose 3 to 5 competencies from the job advert (you have ${comps.length}).`; return; }
  state.profile = { name: v("f-name"), programme: v("f-prog"), role: v("f-role"), company: v("f-co"), comps };
  if (!state.id) state.id = "CR-" + String(Date.now() % 100000).padStart(5, "0");
  state.date = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  state.step = "A"; save(); render(); window.scrollTo(0, 0);
});

app.addEventListener("click", e => {
  const h = e.target.closest("a[data-handoff]"); if (h) { h.href = handoffUrl(); return; }
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "a-next") {
    const start = state.aPage * PAGE_SIZE, end = Math.min(start + PAGE_SIZE, ITEMS.length);
    const missing = []; for (let i = start; i < end; i++) if (!state.a[i]) missing.push(i + 1);
    if (missing.length) { document.getElementById("a-msg").textContent = `Answer every statement on this page first (missing: ${missing.join(", ")}).`; return; }
    if (end >= ITEMS.length) state.step = "B"; else state.aPage++;
    save(); render(); window.scrollTo(0, 0);
  } else if (act === "a-back") { state.aPage = Math.max(0, state.aPage - 1); save(); render(); window.scrollTo(0, 0); }
  else if (act === "b-submit") {
    const missing = SJT.map((s, i) => i).filter(i => !state.b[i] || state.b[i].most === undefined || state.b[i].least === undefined).map(i => i + 1);
    if (missing.length) { document.getElementById("b-msg").textContent = `Choose a most and a least effective response for scenario ${missing.join(", ")}.`; return; }
    state.step = "c"; save(); render(); window.scrollTo(0, 0);
  } else if (act === "timed-start") {
    const p = state[state.step]; p.startedAt = Date.now(); p.deadline = p.startedAt + TIMED[state.step].secs * 1000;
    save(); render(); window.scrollTo(0, 0);
  } else if (act === "timed-submit") finishTimed(state.step, false);
  else if (act === "pdf") downloadPdf(b);
  else if (act === "copy-link") {
    const msg = document.getElementById("pdf-msg"), url = handoffUrl();
    navigator.clipboard.writeText(url).then(() => { msg.textContent = "Link copied. Paste it into your browser's address bar, then press Download PDF report."; msg.className = "msg ok"; })
      .catch(() => { msg.innerHTML = `Copying isn't available here. Select this whole link and copy it:<br><textarea readonly style="min-height:70px;margin-top:6px">${esc(url)}</textarea>`; msg.className = "msg"; const t = msg.querySelector("textarea"); if (t) { t.focus(); t.select(); } });
  }
  else if (act === "leave-sample") { SAMPLE = false; try { history.replaceState(null, "", location.pathname + location.search); } catch (err) {} load(); render(); window.scrollTo(0, 0); }
  else if (act === "copy") {
    const t = reportText(), msg = document.getElementById("pdf-msg");
    navigator.clipboard.writeText(t).then(() => { msg.textContent = "Report copied. Paste it into a document."; msg.className = "msg ok"; })
      .catch(() => { msg.textContent = "Copying isn't available here. Select the report text on this page and copy it manually."; msg.className = "msg"; });
  } else if (act === "reset") {
    document.getElementById("reset-zone").innerHTML = `<span class="small">This deletes your answers and report from this browser. Download your PDF first.</span><button type="button" class="danger" data-act="reset-yes">Delete and start again</button><button type="button" class="quiet" data-act="reset-no">Keep my report</button>`;
  } else if (act === "reset-yes") { state = blank(); save(); render(); window.scrollTo(0, 0); }
  else if (act === "reset-no") render();
});

render();
</script>

</body>
